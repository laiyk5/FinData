[project]
site_name = "findata"
site_description = "Local, plugin-oriented financial dataset maintenance and querying"
site_url = "https://laiyk5.github.io/FinData/"
site_author = "Lai"
copyright = """
Copyright &copy; 2026 The authors
"""
repo_url = "https://github.com/laiyk5/FinData"
docs_dir = "docs/site"

nav = [
  "index.md",
  { "Get started" = [
    "get-started/installation.md",
    "get-started/quickstart.md",
  ]},
  { "Core Concepts" = [
    "guide/workspace.md",
    "guide/client-server.md",
    "guide/plugin-architecture.md",
  ]},
  { "Data" = [
    "guide/providers-and-datasets.md",
    "guide/tasks-and-events.md",
    "guide/reading-data.md",
    "guide/dataloader.md",
  ]},
  { "Custom datasets" = [
    { "Quick start" = "guide/custom-datasets/index.md" },
    { "SDK reference" = "guide/custom-datasets/sdk-reference.md" },
    { "How-to guides" = [
      "guide/custom-datasets/how-to/test.md",
    ]},
  ]},
  { "Official plugins" = [
    "plugins/index.md",
    "plugins/demo.md",
    "plugins/tushare.md",
  ]},
  { "Reference" = [
    "reference/cli.md",
  ]},
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "blue grey"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "blue grey"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
