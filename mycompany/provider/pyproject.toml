[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycompany-provider-hello"
version = "0.1.0"
description = "Provider plugin for mycompany/hello"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata",
]

[project.entry-points."findata.providers"]
hello = "mycompany.plugins.providers.hello:provider_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/mycompany.plugins.providers.hello"]
sources = ["src"]
