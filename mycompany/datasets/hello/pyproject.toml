[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycompany-datasets-hello"
version = "0.1.0"
description = "Dataset plugin for mycompany/hello"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata",
  "mycompany-provider-hello==0.1.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
hello = "mycompany.plugins.datasets.hello:hello_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/mycompany.plugins.datasets.hello"]
sources = ["src"]
