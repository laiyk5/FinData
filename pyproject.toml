[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata"
version = "0.3.0"
description = "Local, plugin-oriented financial dataset maintenance and querying"
requires-python = ">=3.11"
dependencies = [
  "click==8.4.2",
  "duckdb==1.5.4",
  "pyarrow>=15",
  "rich==15.0.0",
]

[project.scripts]
findata = "findata.cli:main"
findata-server = "findata.server_cli:main"

[project.optional-dependencies]
dev = [
  # Official plugins are development/test-only members of this workspace;
  # findata itself never depends on a plugin distribution.
  "findata-tushare==0.3.0",
  "nox>=2025.5.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.15.22",
]

[dependency-groups]
docs = [
  "mkdocs-material==9.7.7",
]

[tool.uv.workspace]
members = ["plugins/tushare"]

[tool.uv.sources]
findata-tushare = { workspace = true }

[tool.hatch.build]
# The WebUI bundle is built from web/ (npm run build) and git-ignored; it must
# still ship in the sdist and wheel.
artifacts = ["src/findata/webui/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/findata"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "real_api: requires explicit human approval and FINDATA_ALLOW_REAL_API=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
