[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata"
version = "0.4.0"
description = "Local, plugin-oriented financial dataset maintenance and querying"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "click==8.4.2",
  "duckdb==1.5.4",
  "pyarrow>=15",
  "rich==15.0.0",
]

[project.scripts]
findata = "findata.cli.main:main"
findata-server = "findata.server.server_cli:main"

[project.optional-dependencies]
dev = [
  # Official plugins are development/test-only members of this workspace;
  # findata itself never depends on a plugin distribution.
  "findata-plugins==0.4.0",
  "findata-plugins-datasets-tushare-daily-basic==0.4.0",
  "findata-plugins-datasets-tushare-index-basic==0.4.0",
  "findata-plugins-datasets-tushare-index-weight==0.4.0",
  "findata-plugins-datasets-tushare-stock-basic==0.4.0",
  "findata-plugins-datasets-tushare-trade-cal==0.4.0",
  "findata-plugins-providers-tushare==0.4.0",
  "findata-plugins-shared==0.4.0",
  # Demo/test plugins for the findata-test namespace
  "findata-test-providers-demo==0.1.0",
  "findata-test-datasets-demo-hello==0.1.0",
  "findata-test-datasets-demo-random==0.1.0",
  "findata-test-demo==0.1.0",
  "nox>=2025.5.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff==0.15.22",
]

[dependency-groups]
docs = [
  "zensical>=0.0.51",
]

[tool.uv.workspace]
members = [
  "plugins/tushare/shared",
  "plugins/tushare/provider",
  "plugins/tushare/trade-cal",
  "plugins/tushare/stock-basic",
  "plugins/tushare/index-basic",
  "plugins/tushare/index-weight",
  "plugins/tushare/daily-basic",
  "plugins/tushare/umbrella",
  "plugins/demo/provider",
  "plugins/demo/datasets/demo-hello",
  "plugins/demo/datasets/demo-random",
  "plugins/demo/datasets/umbrella",
]

[tool.uv.sources]
findata = { workspace = true }
findata-plugins-shared = { workspace = true }
findata-plugins-providers-tushare = { workspace = true }
findata-plugins-datasets-tushare-trade-cal = { workspace = true }
findata-plugins-datasets-tushare-stock-basic = { workspace = true }
findata-plugins-datasets-tushare-index-basic = { workspace = true }
findata-plugins-datasets-tushare-index-weight = { workspace = true }
findata-plugins-datasets-tushare-daily-basic = { workspace = true }
findata-plugins = { workspace = true }
findata-test-providers-demo = { workspace = true }
findata-test-datasets-demo-hello = { workspace = true }
findata-test-datasets-demo-random = { workspace = true }
findata-test-demo = { workspace = true }

[tool.hatch.build]
# The WebUI bundle is built from web/ (npm run build) and git-ignored; it must
# still ship in the sdist and wheel.
artifacts = ["src/findata/webui/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/findata"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "real_api: requires explicit human approval and FINDATA_ALLOW_REAL_API=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
