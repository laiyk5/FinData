[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "findata"
version = "0.1.0"
description = "Local, plugin-oriented financial dataset maintenance and querying"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15",
]

[project.scripts]
findata = "findata.cli:main"
findata-server = "findata.server_cli:main"

[project.entry-points."findata.datasets"]
tushare_trade_cal = "findata.datasets.tushare:trade_cal_plugin"
tushare_stock_basic = "findata.datasets.tushare:stock_basic_plugin"
tushare_index_basic = "findata.datasets.tushare:index_basic_plugin"
tushare_index_weight = "findata.datasets.tushare:index_weight_plugin"
tushare_daily_basic = "findata.datasets.tushare:daily_basic_plugin"

[project.entry-points."findata.providers"]
tushare = "findata.providers.tushare:tushare_provider_plugin"

[project.optional-dependencies]
dev = [
  "nox>=2025.5.1",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "real_api: requires explicit human approval and FINDATA_ALLOW_REAL_API=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
