[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "findata"
version = "0.1.0.dev0"
description = "Local, plugin-oriented financial dataset maintenance and querying"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "real_api: requires explicit human approval and FINDATA_ALLOW_REAL_API=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

