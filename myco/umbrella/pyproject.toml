[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myco-plugins-test"
version = "0.1.0"
description = "Metapackage installing every myco plugin for findata"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "myco-provider-test==0.1.0",
  "myco-datasets-test==0.1.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
bypass-selection = true
