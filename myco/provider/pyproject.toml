[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myco-provider-test"
version = "0.1.0"
description = "Provider plugin for myco/test"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata",
]

[project.entry-points."findata.providers"]
test = "myco.plugins.providers.test:provider_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/myco.plugins.providers.test"]
sources = ["src"]
