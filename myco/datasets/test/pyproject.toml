[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myco-datasets-test"
version = "0.1.0"
description = "Dataset plugin for myco/test"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata",
  "myco-provider-test==0.1.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
test = "myco.plugins.datasets.test:test_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/myco.plugins.datasets.test"]
sources = ["src"]
