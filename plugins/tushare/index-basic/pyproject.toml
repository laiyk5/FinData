[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-plugins-datasets-tushare-index-basic"
version = "0.4.0"
description = "Official Tushare index basic dataset plugin for findata"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata-plugins-providers-tushare==0.4.0",
  "findata-plugins-shared==0.4.0",
  "findata==0.4.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
tushare_index_basic = "findata_plugins.plugins.datasets.tushare_index_basic:index_basic_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_plugins/plugins/datasets/tushare_index_basic"]
sources = ["src"]
