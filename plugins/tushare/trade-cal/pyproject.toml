[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-plugins-datasets-tushare-trade-cal"
version = "0.3.0"
description = "Official Tushare trade calendar dataset plugin for findata"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata-plugins-providers-tushare==0.3.0",
  "findata-plugins-shared==0.3.0",
  "findata==0.3.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
tushare_trade_cal = "findata_plugins.plugins.datasets.tushare_trade_cal:trade_cal_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_plugins/plugins/datasets/tushare_trade_cal"]
sources = ["src"]
