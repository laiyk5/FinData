[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-dataset-tushare-trade-cal"
version = "0.3.0"
description = "Official Tushare trade calendar dataset plugin for findata"
requires-python = ">=3.11"
dependencies = [
  "findata==0.3.0",
  "findata-provider-tushare==0.3.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
tushare_trade_cal = "findata_tushare_trade_cal:trade_cal_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/findata_tushare_trade_cal"]
