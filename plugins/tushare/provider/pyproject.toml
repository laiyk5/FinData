[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-plugins-providers-tushare"
version = "0.4.0"
description = "Official Tushare provider plugin for findata"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata==0.4.0",
  "findata-plugins-shared==0.4.0",
]

[project.entry-points."findata.providers"]
tushare = "findata_plugins.tushare.plugins.providers.tushare:tushare_provider_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_plugins"]
sources = ["src"]
