[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-provider-tushare"
version = "0.3.0"
description = "Official Tushare provider plugin and shared dataset operation engine for findata"
requires-python = ">=3.11"
dependencies = [
  "findata==0.3.0",
  "pyarrow>=15",
]

[project.entry-points."findata.providers"]
tushare = "findata_tushare_provider.provider:tushare_provider_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/findata_tushare_provider"]
