[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-tushare"
version = "0.3.0"
description = "Official Tushare provider and dataset plugins for findata"
requires-python = ">=3.11"
# This distribution is a findata plugin: it is only ever installed alongside
# findata, which depends on it by default. It deliberately does not declare a
# dependency on findata, because findata declares the dependency on this
# package and circular metadata is avoided.
dependencies = [
  "pyarrow>=15",
]

[project.entry-points."findata.providers"]
tushare = "findata_tushare.provider:tushare_provider_plugin"

[project.entry-points."findata.datasets"]
tushare_trade_cal = "findata_tushare.datasets:trade_cal_plugin"
tushare_stock_basic = "findata_tushare.datasets:stock_basic_plugin"
tushare_index_basic = "findata_tushare.datasets:index_basic_plugin"
tushare_index_weight = "findata_tushare.datasets:index_weight_plugin"
tushare_daily_basic = "findata_tushare.datasets:daily_basic_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/findata_tushare"]
