[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-plugins"
version = "0.3.0"
description = "Metapackage installing every official Tushare provider and dataset plugin for findata"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata-plugins-datasets-tushare-daily-basic==0.3.0",
  "findata-plugins-datasets-tushare-index-basic==0.3.0",
  "findata-plugins-datasets-tushare-index-weight==0.3.0",
  "findata-plugins-datasets-tushare-stock-basic==0.3.0",
  "findata-plugins-datasets-tushare-trade-cal==0.3.0",
  "findata-plugins-providers-tushare==0.3.0",
  "findata-plugins-shared==0.3.0",
]

# Metadata-only distribution: no import package, no entry points.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
bypass-selection = true
