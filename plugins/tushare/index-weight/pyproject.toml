[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-dataset-tushare-index-weight"
version = "0.3.0"
description = "Official Tushare index weight dataset plugin for findata"
requires-python = ">=3.11"
dependencies = [
  "findata==0.3.0",
  "findata-dataset-tushare-index-basic==0.3.0",
  "findata-provider-tushare==0.3.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
tushare_index_weight = "findata_tushare_index_weight:index_weight_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/findata_tushare_index_weight"]
