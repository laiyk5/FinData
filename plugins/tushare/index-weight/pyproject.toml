[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-plugins-datasets-tushare-index-weight"
version = "0.6.0"
description = "Official Tushare index weight dataset plugin for findata"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata-plugins-datasets-tushare-index-basic==0.6.0",
  "findata-plugins-providers-tushare==0.6.0",
  "findata-plugins-shared==0.6.0",
  "findata==0.6.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
tushare_index_weight = "findata_plugins.tushare.plugins.datasets.index.index_weight:index_weight_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_plugins"]
sources = ["src"]
