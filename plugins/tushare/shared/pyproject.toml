[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-plugins-shared"
version = "0.6.0"
description = "Shared operation engine, publication windows, and mock transport for findata plugins"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata==0.6.0",
  "pyarrow>=15",
]

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_plugins"]
sources = ["src"]
