[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-test-datasets-demo-random"
version = "0.1.0"
description = "Demo random-walk dataset plugin for findata — generates simulated asset price data"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata==0.4.0",
  "findata-test-providers-demo==0.1.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
demo_random = "findata_test.demo.plugins.datasets.synthetic.random:demo_random_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_test"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/findata_test"]
sources = ["src"]
