[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "findata-test-datasets-demo-hello"
version = "0.1.0"
description = "Minimal example dataset plugin for findata — generates hardcoded greeting data"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "findata==0.3.0",
  "findata-test-providers-demo==0.1.0",
  "pyarrow>=15",
]

[project.entry-points."findata.datasets"]
demo_hello = "findata_test.plugins.datasets.demo_hello:demo_hello_plugin"

[tool.hatch.build.targets.wheel]
only-include = ["src/findata_test/plugins/datasets/demo_hello"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/findata_test/plugins/datasets/demo_hello"]
sources = ["src"]
